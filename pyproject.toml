[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genmodels"
version = "0.1.0"
description = "MNIST classifier, DCGAN, WGAN and VAE for ECE-693BT Assignment 2"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
# torchvision ships no py.typed or stubs. Its values are Unknown to pyright anyway,
# so this only silences the stub-not-found notice. Revisit: local stubs (see todo).
reportMissingTypeStubs = "none"
