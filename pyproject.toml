[project]
name = "genmodels"
version = "0.1.0"
description = "MNIST classifier, DCGAN, WGAN and VAE for ECE-693BT Assignment 2"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.basedpyright]
# base.py is a scratch script; the codebase is src/ and its tests. Keep the
# checker scoped to what the repo owns (bench_classifier.py is untracked).
include = ["src", "tests"]
# basedpyright defaults to "all"; this repo uses "strict" instead.
typeCheckingMode = "strict"
# torchvision ships no py.typed or stubs. Its values are Unknown to pyright anyway,
# so this only silences the stub-not-found notice. Revisit: local stubs (see todo).
reportMissingTypeStubs = "none"
# strict reports Unknown (missing types) but not Any (declared as "anything").
# PyTorch declares Any in common places, e.g. nn.Module.__call__ returns Any, so
# model(x) is Any and autocomplete is lost. Flag both. Fix at the source with
# cast(...) or a typed __call__; suppress per line with
# `# pyright: ignore[reportAny]`.
reportAny = "error"
reportExplicitAny = "error"
